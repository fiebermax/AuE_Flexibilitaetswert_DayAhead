# Alle Annahmen an einer Stelle. Jede Änderung mit Begründung im Commit.

seed: 42

zeitraeume:
  training:      ["2023-01-01", "2024-12-31"]
  test_1_stunde: ["2025-01-01", "2025-09-30"]   # Stundenregime
  test_2:        ["2025-10-01", "2026-09-30"]  # zweiter Testzeitraum (Stundenwerte; Viertelstunde ist Nichtziel)
  stresstest:    ["2022-01-01", "2022-12-31"]   # Gaspreiskrise, nie im Training
  datenstand:    "2026-10-31"

markt:
  gebotszone: "DE-LU"
  produkt: "day_ahead"          # kein Intraday (Abgrenzung)
  smard_filter_preis: 4169
  regimewechsel: "2025-10-01"    # erster Tag mit Viertelstundenprodukten (SDAC)
  zeitzone: "Europe/Berlin"

daten:                           # R2: Download und Ablage (src/01_download.py, src/02_synthetisch.py)
  smard_basis_url: "https://www.smard.de/app/chart_data"
  aufloesungen:                  # Download ab "von" bis zeitraeume.datenstand; nur Stundenwerte
    hour: "2022-01-01"
  pfade:                         # relativ zum Repo-Wurzelverzeichnis
    raw: "data/raw"
    processed: "data"
    tables: "ergebnisse"          # Ergebnisse des Backtests (R3, R4), Ordner entsteht beim ersten Lauf
  http_versuche: 5               # Retry bei Verbindungsfehlern
  http_timeout_s: 30

cleaning:                        # R2: src/cleaning.py
  reports: "ergebnisse/datenqualitaet"
  preis_min_eur_mwh: -500        # SDAC-Preisgrenzen; Minimum -500 im ganzen Zeitraum
  preis_max_eur_mwh: 5000        # Maximum war 2022-2026 zwischen +3000 und +5000; weitester Wert
  ausreisser_schwelle: 3.5       # modifizierter z-Wert (Iglewicz & Hoaglin 1993), je Jahr x Monat x Stunde; nur markieren

last:                            # Praxispartner: Interview 09.11.2026, Termin mit dem Team 10.11.2026
  produktionstage: "taeglich"    # an jedem Tag, auch an Feiertagen (Praxispartner); Alternative: "Mo-Fr ohne Feiertage Bayern"
  betrieb_start_h: 6             # Produktion 06-22 Uhr, 16 h am Tag (Praxispartner)
  betrieb_ende_h: 22
  gesamtverbrauch_mwh_pro_tag: 180.0   # Werk: 65 GWh/a, rund 180 MWh/Tag (Praxispartner)
  # Verschiebbarer Hauptfall S1: Reinigung (CIP), 4 MW für ca. 2 h, voll elektrisch (Praxispartner)
  prozess: "Reinigung (CIP)"
  mwh_pro_tag: 8.0               # = 4 MW x 2 h (Praxispartner), bestätigt am 11.11.2026; 16 MWh nur als Sensitivität V6c
  blocklaenge_h: 2               # Dauer einer Reinigung
  fenster_start_h: 22            # Reinigung nur in der Nebenzeit 22-06 Uhr (Praxispartner); Fenster geht über Mitternacht
  fenster_ende_h: 6
  status_quo_start_h: 22         # Status quo A: Reinigung 22-24 Uhr, direkt nach Produktionsende (Tatsache: Praxispartner, Interview 10.11.2026)
  feiertagsvariante_mariae_himmelfahrt: false   # wirkt nur auf die Spalte werktag der Preise

kosten:
  mitarbeiter: 3                 # Personal an der Reinigung (Annahme Team A6, Bandbreite 2-4)
  stundenlohn_eur: 35.0          # Zeitarbeit (Annahme Team A7, Bandbreite 30-45 EUR/h; Quelle offen)
  nachtzuschlag: 0.25            # vom Praxispartner geschätzt, Bandbreite 0.25-0.30
  wochenendzuschlag: 0.50        # Samstag UND Sonntag (Teamdokument); vom Praxispartner geschätzt, Bandbreite 0.30-0.50
  feiertagszuschlag: 1.00        # vom Praxispartner geschätzt, bis 1.00
  nachtstunden: [22, 23, 0, 1, 2, 3, 4, 5]   # 22-06 Uhr komplett Nacht (Basisannahme, beim Partner bestätigt); Sensitivität V9: 23-06
  zuschlag_regel: "hoechster"    # Nacht/Wochenende/Feiertag: nur der höchste gilt (Basis); Sensitivität V10: "addiert"
                                 # Kalendertag der STUNDE zählt (Sa 22 Uhr = Samstag, So 02 Uhr = Sonntag), Spalten sonntag/feiertag
  umstellungskosten_eur_pro_jahr: null   # aus Recherche bzw. Kontakt, dann als Kurve
  festpreis_eur_mwh: 85.0        # Festpreis für rund 70 % der Menge, Einkauf im Januar für das Folgejahr (Praxispartner)
  festpreis_aufschlag: 0.10      # nur genutzt, wenn festpreis_eur_mwh null ist

vertrag:                         # Angaben des Praxispartners
  spot_anteil: 0.30              # rund 53 von 180 MWh/Tag am Day-Ahead-Markt
  bewertung_verschiebung: "band" # Festpreis deckt den Grundverbrauch und wird voll verbraucht; die Reinigung liegt
                                 # obendrauf und wird zu 100 % am Day-Ahead gekauft (Faktor 1,0, einziger Hauptfall).
                                 # "proportional" (nur spot_anteil) nur noch als Sensitivität V8

strategien:
  historie_wochen: 4             # B: Median der letzten 4 gleichen Werktage
  saisonaler_block: true         # D_saison: ein Block je Saison (K3-Nachweis in EUR gegen D)

planung:                         # R2: Datenzugriff für den Backtest (src/datenzugriff.py)
  planungstag: "Friday"          # Schichtplan für die Folgewoche (Mo-So)
  planungsuhrzeit: "08:00"       # Freitagmorgen (Praxispartner); vor 12:45 sind nur die Freitagspreise bekannt
  day_ahead_veroeffentlichung: "12:45"   # SDAC-Ergebnis für den Folgetag (ca.); vorher ist nur Freitag bekannt
  nur_volle_wochen: true         # Wochen, die über eine Periodengrenze reichen, werden nicht gewertet

statistik:
  alpha_gesamt: 0.05
  anzahl_hypothesen: 3           # Bonferroni, H0a-H0c im README
  sensitivitaet_schwelle_pct: 5  # Variante relevant ab 5 % Änderung der Ersparnis
  bootstrap_n: 5000
  bootstrap_block_wochen: 4
