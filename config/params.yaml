# Alle Annahmen an einer Stelle. Jede Änderung mit Begründung ins Projekttagebuch.

seed: 42

zeitraeume:
  training:      ["2023-01-01", "2024-12-31"]
  test_1_stunde: ["2025-01-01", "2025-09-30"]   # Stundenregime
  test_2_viertel: ["2025-10-01", "2026-09-30"]  # Viertelstundenregime ab 01.10.2025
  stresstest:    ["2022-01-01", "2022-12-31"]   # Gaspreiskrise, nie im Training
  datenstand:    "2026-10-31"

markt:
  gebotszone: "DE-LU"
  produkt: "day_ahead"          # kein Intraday (Abgrenzung, siehe Tagebuch)
  smard_filter_preis: 4169
  regimewechsel: "2025-10-01"    # erster Tag mit Viertelstundenprodukten (SDAC)
  zeitzone: "Europe/Berlin"

daten:                           # R2: Download und Ablage (src/01, src/02)
  smard_basis_url: "https://www.smard.de/app/chart_data"
  aufloesungen:                  # Download ab "von" bis zeitraeume.datenstand; nur Stundenwerte (Tagebuch E-021)
    hour: "2022-01-01"
  pfade:                         # relativ zum Repo-Wurzelverzeichnis
    raw: "data/raw"
    processed: "data/processed"
    tables: "results/tables"
  http_versuche: 5               # Retry bei Verbindungsfehlern
  ausreisser_schwelle: 3.5       # modifizierter z-Wert (Iglewicz & Hoaglin 1993), je Jahr x Monat x Stunde; nur markieren
  http_timeout_s: 30

last:                            # Praxiskontakt 09.11.2026 (Tagebuch K-003, K-005); flexibler Anteil noch Platzhalter
  produktionstage: "taeglich"    # Produktion an 7 Tagen pro Woche (K-005); Alternative: "Mo-Fr ohne Feiertage Bayern"
  betrieb_start_h: 6             # Betriebszeit 06-22 Uhr, 16 h am Tag (K-003, K-005)
  betrieb_ende_h: 22
  gesamtverbrauch_mwh_pro_tag: 50.0   # ganzes Werk, 50 000 kWh pro Tag (K-005); nur zur Einordnung
  mwh_pro_tag: 2.0               # PLATZHALTER: verschiebbarer Anteil pro Tag, Prozess noch festzulegen (K-005)
  blocklaenge_h: 6               # Block muss in der Betriebszeit liegen
  status_quo_start_h: 8          # Strategie A: fest 08-14 Uhr
  feiertagsvariante_mariae_himmelfahrt: false   # wirkt nur auf die Spalte werktag der Preise

kosten:
  mitarbeiter: 3
  stundenlohn_eur: 30.0
  nachtzuschlag: 0.25            # Sensitivität 0.00-0.30
  nachtstunden: [23, 0, 1, 2, 3, 4, 5]
  umstellungskosten_eur_pro_jahr: null   # aus Recherche bzw. Kontakt, dann als Kurve
  festpreis_eur_mwh: null        # null = Mittel Training + Aufschlag
  festpreis_aufschlag: 0.10

strategien:
  historie_wochen: 4             # B: Median der letzten 4 gleichen Werktage
  saisonaler_block: true         # D je Saison (K3-Kandidat)
  tagessteuerung: true           # T: Kontrastfall, Day-Ahead am Vortag bekannt

planung:                         # R2: Datenzugriff für den Backtest (src/datenzugriff.py)
  planungstag: "Friday"          # Schichtplan für die Folgewoche (Mo-So)
  planungsuhrzeit: "12:00"       # Annahme: Planung Freitagmittag
  day_ahead_veroeffentlichung: "12:45"   # SDAC-Ergebnis für den Folgetag (ca.); vorher ist nur Freitag bekannt
  nur_volle_wochen: true         # Wochen, die über eine Periodengrenze reichen, werden nicht gewertet

statistik:
  alpha_gesamt: 0.05
  anzahl_hypothesen: 3           # Bonferroni
  bootstrap_n: 5000
  bootstrap_block_wochen: 4
